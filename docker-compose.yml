version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recomfusion-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - SECRET_KEY=recomfusion-production-secret-key-2026
      - MODEL_ARTIFACT_PATH=./artifacts
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recomfusion-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
